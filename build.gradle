plugins {
    id 'com.android.application' version '9.5.3'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace 'com.xlythe.saolauncher.smsextension'
    compileSdk 37
    defaultConfig {
        applicationId 'com.xlythe.saolauncher.smsextension'
        minSdk 23
        targetSdk 37
        versionCode 13
        versionName '2.5'
    }
    buildFeatures { buildConfig = true }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['src']
        res.srcDirs = ['res']
        assets.srcDirs = ['assets']
    }
}

dependencies {
    implementation 'com.xlythe:android-text-manager:2.0.0'
    implementation 'com.xlythe:viewpager-indicator:2.4.1'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.loader:loader:1.2.0'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.cursoradapter:cursoradapter:1.0.0'
}
